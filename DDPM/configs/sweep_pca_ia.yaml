# ============================================================================
# wandb bayesian sweep -- DDPM CIFAR-10 InTAct Ablation: PCA + intervals
# ============================================================================
# decomp_method="pca": eigendecomposition (eigh on covariance) instead of SVD,
# with full interval-based InTAct protection.
#
# Usage:
#   cd DDPM
#   wandb agent $(wandb sweep configs/sweep_pca_ia.yaml 2>/dev/null | grep -o 'wandb agent .*') --count 50
# ============================================================================

program: pipeline.py
method: bayes
entity: oneandzero24
project: intact-ddpm
name: pca-ia-bayes-50

metric:
  name: score
  goal: maximize

early_terminate:
  type: hyperband
  min_iter: 10
  eta: 3

command:
  - ${env}
  - python
  - ${program}
  - --config
  - configs/pipeline.yaml

parameters:
  unlearn.method:
    value: "rl"

  unlearn.lr:
    distribution: log_uniform_values
    min: 1e-5
    max: 1e-2

  unlearn.n_iters:
    values: [1000, 2000, 3000, 5000, 7000, 10000]

  unlearn.batch_size:
    values: [32, 64]

  intact.decomp_method:
    value: "pca"

  intact.lambda_interval:
    distribution: log_uniform_values
    min: 0.1
    max: 50.0

  intact.reduced_dim:
    values: [8, 16, 32, 64, 128]

  intact.normalize_protection:
    values: [true, false]

  intact.use_actual_bounds:
    values: [true, false]
