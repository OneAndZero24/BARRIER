# ============================================================================
# wandb bayesian sweep -- DDPM CIFAR-10 InTAct Ablation: SVD, no interval
# ============================================================================
# skip_interval=True: keep SVD but skip U_forget interval protection
# (only penalise U_residual + mu drift).  Tests whether intervals add value.
#
# Usage:
#   cd DDPM
#   wandb agent $(wandb sweep configs/sweep_svd_noia.yaml 2>/dev/null | grep -o 'wandb agent .*') --count 50
# ============================================================================

program: pipeline.py
method: bayes
entity: oneandzero24
project: intact-ddpm
name: svd-noia-bayes-50

metric:
  name: score
  goal: maximize

early_terminate:
  type: hyperband
  min_iter: 10
  eta: 3

command:
  - ${env}
  - python
  - ${program}
  - --config
  - configs/pipeline.yaml

parameters:
  unlearn.method:
    value: "ga"

  unlearn.lr:
    distribution: log_uniform_values
    min: 1e-6
    max: 1e-3

  unlearn.n_iters:
    values: [500, 1000, 1500, 2000, 3000, 5000]

  unlearn.batch_size:
    values: [16, 32, 64, 128]

  intact.skip_interval:
    value: true

  intact.lambda_interval:
    distribution: log_uniform_values
    min: 0.1
    max: 50.0

  intact.reduced_dim:
    values: [8, 16, 32, 64, 128]

  intact.normalize_protection:
    values: [true, false]

  intact.use_actual_bounds:
    values: [true, false]
