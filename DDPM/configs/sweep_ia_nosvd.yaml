# ============================================================================
# wandb bayesian sweep -- DDPM CIFAR-10 InTAct Ablation: IA, no SVD
# ============================================================================
# skip_svd=True: no SVD at all -- protect on raw activation space
# (per-dim quantile intervals, no dimensionality reduction).
#
# Usage:
#   cd DDPM
#   wandb agent $(wandb sweep configs/sweep_ia_nosvd.yaml 2>/dev/null | grep -o 'wandb agent .*') --count 50
# ============================================================================

program: pipeline.py
method: bayes
entity: oneandzero24
project: intact-ddpm
name: ia-nosvd-bayes-50

metric:
  name: score
  goal: maximize

early_terminate:
  type: hyperband
  min_iter: 10
  eta: 3

command:
  - ${env}
  - python
  - ${program}
  - --config
  - configs/pipeline.yaml

parameters:
  unlearn.method:
    value: "ga"

  unlearn.lr:
    distribution: log_uniform_values
    min: 1e-6
    max: 1e-3

  unlearn.n_iters:
    values: [500, 1000, 1500, 2000, 3000, 5000]

  unlearn.batch_size:
    values: [16, 32, 64, 128]

  intact.skip_svd:
    value: true

  intact.lambda_interval:
    distribution: log_uniform_values
    min: 0.1
    max: 50.0

  intact.normalize_protection:
    values: [true, false]

  intact.use_actual_bounds:
    values: [true, false]
