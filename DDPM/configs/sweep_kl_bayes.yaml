# ============================================================================
# wandb bayesian sweep -- DDPM CIFAR-10 InTAct KL only  (50 runs)
# ============================================================================
# Usage:
#   cd DDPM
#   wandb agent $(wandb sweep configs/sweep_kl_bayes.yaml 2>/dev/null | grep -o 'wandb agent .*') --count 50
# ============================================================================

program: pipeline.py
method: bayes
entity: oneandzero24
project: intact-ddpm
name: kl-bayes-50

metric:
  name: score
  goal: maximize

early_terminate:
  type: hyperband
  min_iter: 10
  eta: 3

command:
  - ${env}
  - python
  - ${program}
  - --config
  - configs/pipeline.yaml

parameters:
  unlearn.method:
    value: "kl"

  unlearn.lr:
    distribution: log_uniform_values
    min: 1e-6
    max: 5e-4

  unlearn.n_iters:
    values: [500, 1000, 1500, 2000, 3000, 5000]

  unlearn.batch_size:
    values: [16, 32, 64, 128]

  intact.lambda_interval:
    distribution: log_uniform_values
    min: 0.5
    max: 100.0

  intact.reduced_dim:
    values: [8, 16, 32, 64, 128]

  intact.normalize_protection:
    values: [true, false]

  intact.use_actual_bounds:
    values: [true, false]
